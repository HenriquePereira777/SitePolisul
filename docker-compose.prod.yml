# Produção (Oracle Cloud): só o Caddy fica exposto (80/443). Banco e backend ficam na rede interna.
# Uso:  docker compose -f docker-compose.prod.yml up -d --build
services:
  mysql:
    image: mysql:8.0
    container_name: polisual-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: polisual_db
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    # Poucos recursos (VM de 1 GB): MySQL enxuto
    command: --innodb-buffer-pool-size=128M --performance-schema=OFF --max-connections=40
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks: [polisual-net]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: polisual-backend
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/polisual_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_TO: ${MAIL_TO:-}
      MAIL_STARTTLS: ${MAIL_STARTTLS:-true}
      MAIL_SSL: ${MAIL_SSL:-false}
      UPLOAD_DIR: /app/uploads
      JAVA_OPTS: ${JAVA_OPTS:--Xms64m -Xmx320m -XX:+UseSerialGC -XX:MaxMetaspaceSize=128m}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    volumes:
      - uploads_data:/app/uploads
    networks: [polisual-net]

  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_API_URL: ""   # mesma origem: o nginx do frontend encaminha /api e /uploads ao backend
    container_name: polisual-frontend
    restart: always
    depends_on: [backend]
    networks: [polisual-net]

  caddy:
    image: caddy:2
    container_name: polisual-caddy
    restart: always
    depends_on: [frontend]
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-:80}   # ex.: polisulalimentos.com.br  (HTTPS automático). Sem domínio: ":80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [polisual-net]

volumes:
  mysql_data:
  uploads_data:
  caddy_data:
  caddy_config:

networks:
  polisual-net:
    driver: bridge
