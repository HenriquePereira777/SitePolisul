# ================================
# SERVIDOR
# ================================
spring.application.name=polisual-backend
server.port=8080

# Ocultar informacoes tecnicas em erros
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# ================================
# BANCO DE DADOS
# ================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/polisual_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:polisual}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Polisual@2024}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Pool de conexoes seguro
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ================================
# JPA / HIBERNATE
# ================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ================================
# SEGURANCA - JWT
# ================================
# TROQUE ESTA CHAVE EM PRODUCAO — use 256 bits minimo
app.jwt.secret=${JWT_SECRET:polisual-super-secreto-jwt-2024-troque-em-producao}
app.jwt.expiration-ms=${JWT_EXPIRATION:86400000}

# ================================
# RATE LIMITING (requisicoes/minuto por IP)
# ================================
app.rate-limit.contato.capacity=5
app.rate-limit.contato.refill-minutes=1
app.rate-limit.api.capacity=100
app.rate-limit.api.refill-minutes=1

# ================================
# CORS
# ================================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost}

# ================================
# E-MAIL (SMTP) — aviso quando chega mensagem pelo site
# ================================
# Preencha MAIL_* no .env. Sem MAIL_HOST/MAIL_PASSWORD o envio fica desligado
# (a mensagem continua sendo salva no banco normalmente).
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.ssl.enable=${MAIL_SSL:false}
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
# Quem recebe os contatos e de quem o e-mail "parece vir"
app.mail.to=${MAIL_TO:polisulalimentos@polisulalimentos.com.br}
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}

# ================================
# MULTIPART (upload seguro)
# ================================
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=10MB

# ================================
# LOGS
# ================================
logging.level.com.polisual=INFO
logging.level.org.springframework.security=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Painel admin
app.upload-dir=${UPLOAD_DIR:uploads}
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
